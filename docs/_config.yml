# GitHub Pages for this folder: the browser flasher (index.html, served as
# it is) and the manual (manual/, Markdown with the layout below).
title: Switchboard
description: A smart-home remote for the Xteink X4 Pro, and the server behind it.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
titles_from_headings:
  enabled: true
  strip_title: false
defaults:
  - scope:
      path: manual
    values:
      layout: manual
