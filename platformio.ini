; ============================================================================
; Switchboard — boot sequence firmware for the Xteink X4 Pro
; ============================================================================
;
; A standalone PlatformIO project (NOT a CrossPoint fork) that drives the
; X4 Pro through the FreeInk SDK's stable HAL:
;
;   splash (Switchboard logo + slogan) -> Wi-Fi connect -> pick a remote
;   from a list -> debug screen.
;
; It links the same SDK libraries CrossPoint links, via `symlink://`, so it
; runs on the exact hardware without vendoring the HAL.
;
; ---------------------------------------------------------------------------
; ONE-TIME SETUP
; ---------------------------------------------------------------------------
;   1. Clone the FreeInk SDK next to this project:
;        git clone https://github.com/Free-Ink/freeink-sdk
;   2. Point FREEINK_SDK below at that checkout (absolute path is safest on
;      Windows; the relative default assumes ../freeink-sdk).
;   3. Set your Wi-Fi credentials in include/config.h (WIFI_SSID / WIFI_PASS).
;   4. Build + flash:
;        pio run -e x4pro -t upload -t monitor
;
; The X4 Pro's power/nav buttons are GPIO0 (left), GPIO7 (right), GPIO3
; (power); touch is GT911 on the shared I2C bus. All of that is described by
; the FREEINK_DEVICE_X4PRO board profile — this firmware reads pins from
; BoardConfig::ACTIVE rather than hardcoding them.
; ============================================================================

[platformio]
default_envs = x4pro

[freeink]
; ---- EDIT THIS to your FreeInk SDK checkout -------------------------------
sdk = ${PROJECT_DIR}/../freeink-sdk
; --------------------------------------------------------------------------
lib_deps =
  EInkDisplay=symlink://${freeink.sdk}/libs/display/FreeInkDisplay
  InputManager=symlink://${freeink.sdk}/libs/hardware/InputManager
  BoardConfig=symlink://${freeink.sdk}/libs/hardware/BoardConfig
  XteinkDetect=symlink://${freeink.sdk}/libs/hardware/XteinkDetect
  PowerManager=symlink://${freeink.sdk}/libs/hardware/PowerManager
  BatteryMonitor=symlink://${freeink.sdk}/libs/hardware/BatteryMonitor
  FrontlightManager=symlink://${freeink.sdk}/libs/hardware/FrontlightManager
  SDCardManager=symlink://${freeink.sdk}/libs/hardware/SDCardManager
  Icons=symlink://${freeink.sdk}/libs/assets/Icons
  FreeInkUI=symlink://${freeink.sdk}/libs/ui/FreeInkUI
  ; Registry libs (not part of the FreeInk SDK):
  bblanchon/ArduinoJson@^7.0.4   ; JSON parsing for the Home screen's /api/globals fetch
  bodmer/TJpg_Decoder@^1.1.0     ; decodes the Music page's album art (a Home Assistant
                                 ; media_player's entity_picture is a JPEG)

; The SDK libraries keep their public headers in include/ and pull sibling
; headers (Icon.h, the FreeInkUI headers, ...) across library boundaries.
; PlatformIO's dependency finder doesn't always expose those cross-library
; include dirs on its own, so we add every one explicitly. The project's own
; include/ is here too — that's where our consumer-provided Logging.h lives,
; which several SDK libs #include <Logging.h> and expect us to supply.
include_flags =
  -I${PROJECT_DIR}/include
  -I${freeink.sdk}/libs/display/FreeInkDisplay/include
  -I${freeink.sdk}/libs/display/FreeInkDisplay/src
  -I${freeink.sdk}/libs/hardware/InputManager/include
  -I${freeink.sdk}/libs/hardware/BoardConfig/include
  -I${freeink.sdk}/libs/hardware/XteinkDetect/include
  -I${freeink.sdk}/libs/hardware/PowerManager/include
  -I${freeink.sdk}/libs/hardware/BatteryMonitor/include
  -I${freeink.sdk}/libs/hardware/FrontlightManager/include
  -I${freeink.sdk}/libs/hardware/SDCardManager/include
  -I${freeink.sdk}/libs/assets/Icons/include
  -I${freeink.sdk}/libs/ui/FreeInkUI/include
  ; Safety net for the Arduino-ESP32 3.x library split: WiFi #includes its
  ; sibling <Network.h>, which lives in the framework's own Network library.
  ; With the default LDF this resolves on its own; this explicit path guarantees
  ; it even if LDF misses it.
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src

[env:x4pro]
; Platform: pioarduino's "stable" release — Arduino-ESP32 core 3.3.x / ESP-IDF
; 5.5.x, which is what the FreeInk SDK is verified against.
;
; IMPORTANT: the stock PlatformIO `espressif32` platform ships the OUTDATED
; Arduino core 2.0.17, whose WiFi library has no Network.h — building against it
; fails with "Network.h: No such file". You MUST be on pioarduino (this URL).
; If you previously built against another platform, clear the cache so this one
; actually installs (see README "Network.h / stale platform" section) — a
; changed platform URL alone does not always force a re-resolve.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
; Use the exact board the FreeInk SDK's own [env:x4pro] uses: the -n16r8 variant
; has 16 MB flash + 8 MB PSRAM baked into its definition (QIO flash + OPI PSRAM),
; so PSRAM actually enables. The generic esp32-s3-devkitc-1 reported "No PSRAM"
; in the build banner, which starves the framebuffer path.
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
; dio_opi matches CrossPoint's verified X4 Pro env: the prebuilt dio_opi Arduino
; variant enables the TinyUSB CDC/MSC component and matches the board's DIO
; flash + OPI PSRAM wiring. (qio_opi reported "No PSRAM" and mis-set the panel.)
board_build.arduino.memory_type = dio_opi
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

; NOTE: do NOT set lib_ldf_mode = chain+/deep+ here. Those change how PlatformIO
; discovers the Arduino framework's OWN inter-library dependencies and stop the
; WiFi library from pulling in its sibling Network library (Arduino-ESP32 core
; 3.x split Network out of WiFi) — the cause of "Network.h: No such file". The
; default LDF (chain) resolves the framework correctly; our FreeInk cross-library
; headers are handled by the explicit -I flags in build_flags instead, so we
; don't need an aggressive LDF mode at all.

; Force the project include/ (our Logging.h) onto every library build too, and
; derive FIRMWARE_VERSION from git (see tools/gen_version.py's header comment).
; Both run in the default (post) phase so GetLibBuilders() is populated.
extra_scripts =
  add_include_path.py
  tools/gen_version.py

build_unflags = -std=gnu++11
build_flags =
  ; gnu++2a matches the SDK base; our code is fine on it (it built on gnu++17 too).
  -std=gnu++2a
  ; Native USB serial for the monitor (USB-CDC on the S3).
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer: the SSD1677 holds the previous frame in its own RAM.
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  ; FreeInk has no default device — the X4 Pro profile MUST be selected here.
  -DFREEINK_DEVICE_X4PRO=1
  -DBOARD_HAS_PSRAM
  ; Match CrossPoint's verified X4 Pro env:
  -DFREEINK_CAP_USB_MSC=1        ; TinyUSB mass-storage (X4 Pro exposes the SD card)
  -DUSE_BLOCK_DEVICE_INTERFACE=1 ; X4 Pro SD is native SDMMC via SdFat block device
  -DENABLE_SERIAL_LOG            ; enable the SDK's own serial logging (LOG_INF etc.)
  ; Explicit include paths for every SDK lib (see [freeink].include_flags).
  ; These live in build_flags (not just lib-local) so they also apply when
  ; PlatformIO compiles the SDK library sources — that's how FrontlightManager's
  ; own .cpp finds our consumer-provided <Logging.h> in include/.
  ${freeink.include_flags}

lib_deps = ${freeink.lib_deps}
