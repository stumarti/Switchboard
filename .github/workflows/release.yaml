name: Release

# Tag-triggered: `git tag v0.4.0 && git push origin v0.4.0` builds, attaches
# the flashable image to a GitHub Release, and publishes it to the web
# flasher under docs/firmware/ (see docs/index.html).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Switchboard
        uses: actions/checkout@v7
        with:
          path: switchboard
          fetch-depth: 0   # full history so `git describe` (gen_version.py) sees the tag

      # Only a commit already on main (reviewed, CI green) may become a
      # release: a tag pushed on some other branch stops here.
      - name: The tagged commit must be on main
        working-directory: switchboard
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::${{ github.ref_name }} isn't on main; tag a commit from main."
            exit 1
          }

      - name: Check out freeink-sdk
        uses: actions/checkout@v7
        with:
          repository: Free-Ink/freeink-sdk
          # Pinned: a release must build from SDK code someone has looked at,
          # not whatever is on its default branch that day. Bump deliberately
          # (build and try it first), in its own commit.
          ref: a1cf5b4be3e5259f856fe0497129e360e4e1346d
          path: freeink-sdk

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO + esptool
        run: pip install -U platformio esptool

      - name: Build (x4pro)
        working-directory: switchboard
        run: pio run -e x4pro

      # ESP Web Tools flashes ONE file, so the multi-part PlatformIO output
      # (bootloader/partitions/boot_app0/firmware) gets merged into a single
      # flat image starting at offset 0.
      #
      # NOTE: flash_mode/flash_freq/flash_size below match this project's
      # board config (dio_opi, default_16MB.csv) as of the version this
      # workflow was written. If either changes in platformio.ini, check
      # this step still matches — `pio run -v` prints the actual esptool
      # args PlatformIO used for `upload`, which is the source of truth.
      - name: Merge into one flashable image
        working-directory: switchboard
        run: |
          set -euo pipefail
          BUILD_DIR=.pio/build/x4pro
          BOOT_APP0=$(find "$HOME/.platformio/packages" -name boot_app0.bin | head -1)
          if [ -z "$BOOT_APP0" ]; then
            echo "Could not locate boot_app0.bin in ~/.platformio/packages" >&2
            exit 1
          fi
          OUT="switchboard-${{ github.ref_name }}.bin"
          python -m esptool --chip esp32s3 merge_bin \
            -o "$OUT" \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0000  "$BUILD_DIR/bootloader.bin" \
            0x8000  "$BUILD_DIR/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"
          echo "MERGED_BIN=$OUT" >> "$GITHUB_ENV"

      # The app image alone (what a remote installs over the air from the
      # Switchboard server's Settings -> Remote updates), and its SHA-256:
      # the server checks the download against it before accepting it.
      # Named for its board (x4pro, SWITCHBOARD_BOARD in platformio.ini): a
      # server keeps each board's builds apart, and firmware for another
      # device, from its own repository, publishes switchboard-<its board>-app-*.
      - name: App image for over-the-air updates
        working-directory: switchboard
        run: |
          set -euo pipefail
          BOARD=x4pro
          APP="switchboard-${BOARD}-app-${{ github.ref_name }}.bin"
          cp .pio/build/x4pro/firmware.bin "$APP"
          sha256sum "$APP" > "$APP.sha256"
          # The build must say it is this board and this tag
          # (tools/gen_version.py), or the server would refuse it.
          grep -a -q "SWITCHBOARD_FW:${BOARD}:${{ github.ref_name }}" "$APP"
          echo "APP_BIN=$APP" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            switchboard/${{ env.MERGED_BIN }}
            switchboard/${{ env.APP_BIN }}
            switchboard/${{ env.APP_BIN }}.sha256
          generate_release_notes: true

      # Push the latest merged image + manifest to docs/firmware/ on
      # `main` so the web flasher (docs/index.html) always serves the
      # newest tagged release. Done as a fresh checkout of the branch
      # (not the detached tag commit) to avoid fighting a moving branch tip.
      - name: Update web flasher (docs/firmware)
        working-directory: switchboard
        run: |
          set -euo pipefail
          mkdir -p /tmp/webflasher
          cp "${{ env.MERGED_BIN }}" /tmp/webflasher/switchboard-latest.bin
          cat > /tmp/webflasher/manifest.json <<EOF
          {
            "name": "Switchboard",
            "version": "${{ github.ref_name }}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "switchboard-latest.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF

          git fetch origin main:main
          git checkout main
          mkdir -p docs/firmware
          cp /tmp/webflasher/switchboard-latest.bin docs/firmware/switchboard-latest.bin
          cp /tmp/webflasher/manifest.json docs/firmware/manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firmware
          git commit -m "docs: publish web-flasher build for ${{ github.ref_name }}" || echo "nothing to commit"
          git push origin main