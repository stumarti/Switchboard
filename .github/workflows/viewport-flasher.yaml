name: Viewport web flasher

# Keeps the web flasher's viewport firmware (docs/firmware/viewport/, the
# second button on docs/index.html) at the latest release of
# stumarti/Switchboard-Viewport: its whole flash image,
# switchboard-viewport-<tag>.bin, as switchboard-viewport-latest.bin, and a
# manifest for ESP Web Tools.
#
# Runs when that repository's release workflow pings it (repository_dispatch
# "viewport-release", if it has a token for this repository), every six
# hours in case it can't, and by hand (Actions -> Viewport web flasher ->
# Run workflow). It only commits when the release changed.
on:
  repository_dispatch:
    types: [viewport-release]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viewport-flasher
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop (what GitHub Pages serves)
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: The latest viewport release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api repos/stumarti/Switchboard-Viewport/releases/latest > /tmp/release.json 2>/dev/null; then
            echo "No Switchboard-Viewport release yet: nothing to publish."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG=$(jq -r .tag_name /tmp/release.json)
          URL=$(jq -r --arg n "switchboard-viewport-$TAG.bin" '.assets[] | select(.name == $n) | .browser_download_url' /tmp/release.json)
          if [ -z "$URL" ]; then
            echo "::error::$TAG has no switchboard-viewport-$TAG.bin (the whole flash image)"
            exit 1
          fi
          CURRENT=$(jq -r .version docs/firmware/viewport/manifest.json 2>/dev/null || true)
          echo "Latest $TAG, the flasher has ${CURRENT:-nothing}"
          if [ "$TAG" = "$CURRENT" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish it to the flasher
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p docs/firmware/viewport
          curl -sSfL -o docs/firmware/viewport/switchboard-viewport-latest.bin "$URL"
          # An ESP32 image starts with the 0xE9 magic byte; anything else
          # (an HTML error page, say) mustn't reach anyone's display.
          head -c1 docs/firmware/viewport/switchboard-viewport-latest.bin | od -An -tx1 | grep -q e9
          cat > docs/firmware/viewport/manifest.json <<EOF
          {
            "name": "Switchboard Viewport",
            "version": "$TAG",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "switchboard-viewport-latest.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firmware/viewport
          git commit -m "docs: publish the viewport's $TAG to the web flasher" || exit 0
          # The remote's release may have pushed to develop meanwhile.
          git pull --rebase origin develop
          git push origin develop
