name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Switchboard
        uses: actions/checkout@v7
        with:
          path: switchboard

      - name: Check out freeink-sdk
        uses: actions/checkout@v7
        with:
          repository: Free-Ink/freeink-sdk
          # Pinned: a release must build from SDK code someone has looked at,
          # not whatever is on its default branch that day. Bump deliberately
          # (build and try it first), in its own commit.
          ref: a1cf5b4be3e5259f856fe0497129e360e4e1346d
          path: freeink-sdk

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install -U platformio

      # Sibling layout matches what the README/platformio.ini expect locally:
      #   ${{ github.workspace }}/switchboard
      #   ${{ github.workspace }}/freeink-sdk
      - name: Build (x4pro)
        working-directory: switchboard
        run: pio run -e x4pro
  # The firmware's pure logic (Home Assistant parsers, HTTP helpers) built
  # with g++ on the runner and run: test/host/run.sh.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Switchboard
        uses: actions/checkout@v7

      - name: Host tests
        run: ./test/host/run.sh
